name: Upload Images to R2

on:
  push:
    branches:
      - main
    paths:
      - 'public/images/**'
  workflow_dispatch:

jobs:
  upload-images:
    runs-on: ubuntu-latest
    name: Upload Static Images to R2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Upload images to R2
        run: |
          echo "📸 Uploading images to R2 bucket: static-robray-net"
          
          if [ ! -d "public/images" ]; then
            echo "⚠️  No images directory found"
            exit 0
          fi
          
          if [ -z "$(ls -A public/images)" ]; then
            echo "⚠️  No images found"
            exit 0
          fi
          
          count=0
          find public/images -type f | while read file; do
            relative_path="${file#public/images/}"
            count=$((count + 1))
            echo "[$count] Uploading: images/$relative_path"
            wrangler r2 object put static-robray-net/images/$relative_path --file="$file" --remote
          done
          
          echo ""
          echo "✅ All images uploaded successfully!"
          echo "🌐 Available at: https://static.robray.net/images/"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

