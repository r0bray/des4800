name = "des4800-robray-net-site-production"
compatibility_date = "2025-05-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# R2 bucket for static assets
# Note: ASSETS is reserved, using STATIC_BUCKET instead
[[r2_buckets]]
binding = "STATIC_BUCKET"
bucket_name = "static-robray-net"
preview_bucket_name = "static-robray-net"
